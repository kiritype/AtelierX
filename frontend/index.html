<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AtelierX · 캐릭터 스튜디오</title><link rel="stylesheet" href="/ui/styles.css"></head>
<body><header class="app-header"><a class="brand" href="#production"><span class="brand-mark">A</span> Atelier<span class="brand-x">X</span></a><nav aria-label="주 메뉴"><button data-page="production">제작</button><button data-page="gallery">갤러리</button><button data-page="jobs">작업 현황</button><button data-page="settings">설정</button></nav><button id="connection-toggle" class="connection"><span id="connection-status">연결 대기</span></button></header>
<section id="connection-panel" class="connection-panel panel"><div><h2>스튜디오 연결</h2><p class="muted">Core 서비스 토큰으로 연결합니다. 토큰은 이 탭을 닫으면 지워집니다.</p></div><form id="connection-form" class="row"><label class="field">Core 토큰<input id="core-token" type="password" autocomplete="off" required placeholder="실행한 Core의 토큰"></label><button type="submit" class="primary">연결</button></form></section>
<div class="page-heading"><div><p class="eyebrow">YOUR CHARACTER WORKSPACE</p><h1 id="page-title">제작</h1><p id="page-description" class="muted">캐릭터의 다음 장면을 만드세요.</p></div><span class="badge">LOCAL PILOT</span></div>
<div id="notice" role="status" aria-live="polite" hidden></div><main id="workspace"><section class="empty panel"><h2>작업을 시작할 준비가 되었어요</h2><p class="muted">위에서 스튜디오에 연결하면 저장된 캐릭터와 작업을 불러옵니다.</p></section></main>
<footer>AtelierX <span>캐릭터 제작 · 생성 · 검토</span></footer><script type="module" src="/ui/app.js"></script></body></html>
