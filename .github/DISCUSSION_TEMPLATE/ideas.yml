body:
  - type: textarea
    id: problem
    attributes:
      label: 하려는 일과 지금 불편한 점 (Problem)
      description: 어떤 작업을 하다가 무엇이 불편했는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 원하는 동작 (Proposal)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 지금 쓰는 우회 방법이나 다른 방법 (Alternatives)
  - type: checkboxes
    id: check
    attributes:
      label: 확인 (Check)
      options:
        - label: 특정 플랫폼 전용 규칙이라면 플랫폼 프리셋으로 해결할 수 있는지 살펴봤습니다 (Checked whether a platform preset covers it)
