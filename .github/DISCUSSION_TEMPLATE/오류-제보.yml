body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 고맙습니다. 확인되면 이슈로 옮겨 진행하고 이 글에 알려 드립니다.
        보안 취약점은 여기에 쓰지 말고 [비공개로 제보](https://github.com/kiritype/AtelierX/security/advisories/new)해 주세요.
  - type: input
    id: version
    attributes:
      label: 앱 버전 (App version)
      description: 도움말 → AtelierX 정보에 나오는 버전. 예) 0.1.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역 (Area)
      options:
        - 작품·편집기 (Works, editor)
        - LLM·에이전트 (LLM, agent)
        - 대화 테스트 (Chat test)
        - 이미지 생성 (Image generation)
        - 갤러리·이미지 도구 (Gallery, image tools)
        - LoRA
        - 설치·업데이트 (Install, update)
        - 설정·잠금 (Settings, lock)
        - 기타 (Other)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차 (Steps to reproduce)
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 기대한 동작과 실제 동작 (Expected and actual)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경 (Environment)
      description: Windows 버전, 이미지 서비스(ComfyUI 판 / NovelAI / PixAI), LLM 연결 종류
  - type: textarea
    id: logs
    attributes:
      label: 로그·화면 (Logs, screenshots)
      description: |
        앱 폴더의 `state/logs/desktop.log`(필요하면 `stderr.log`)에서 문제가 난 시각 근처를 붙여 주세요.
        API 키, 비밀번호, 개인 작품 내용은 지우고 올려 주세요.
