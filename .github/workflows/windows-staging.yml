name: Windows staging package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install test dependencies
        run: python -m pip install -e . pytest ruff
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Backend tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Frontend tests
        working-directory: web
        run: node node_modules/vitest/vitest.mjs run
      - name: Isolated packaging environment
        run: |
          python -m venv notes/packaging/build-venv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          notes/packaging/build-venv/Scripts/python.exe -m pip install -r packaging/requirements-windows.txt -e .
      - name: Build package, licenses and manual
        run: notes/packaging/build-venv/Scripts/python.exe tools/build_windows.py --output dist/staging
      - name: Packaged API smoke test
        run: python tools/smoke_package.py dist/staging/AtelierX/AtelierX.exe
      - uses: actions/upload-artifact@v7
        with:
          name: atelierx-windows-staging
          path: |
            dist/staging/*.zip
            dist/staging/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: atelierx-manual
          path: dist/manual/
          if-no-files-found: error
