name: Manual on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/manual/**', '.github/workflows/manual-pages.yml']
  pull_request:
    paths: ['docs/manual/**', '.github/workflows/manual-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/manual/package-lock.json
      - run: npm ci
        working-directory: docs/manual
      - run: npm run build
        working-directory: docs/manual
        env:
          DOCS_BASE: ${{ vars.DOCS_BASE || (endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name)) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/manual-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
