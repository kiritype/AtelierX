name: Manual on GitHub Pages

# The site follows main (the released version). A fix to the manual alone can go out before the next release:
# run this workflow on main with `ref` set to a docs branch made from main that changes only docs/manual/.
# The run itself stays on main because the github-pages environment deploys from main only.
on:
  push:
    branches: [main]
    paths: ['docs/manual/**', '.github/workflows/manual-pages.yml']
  pull_request:
    paths: ['docs/manual/**', '.github/workflows/manual-pages.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to publish (made from main, changing only docs/manual/). Empty: main.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: manual-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      # A branch published by hand must be main plus manual changes only, so nothing unreleased reaches the site.
      - name: Check the branch to publish
        if: github.event_name == 'workflow_dispatch' && inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::$REF does not contain main. Make it from main (or bring main into it) first."
            exit 1
          fi
          other=$(git diff --name-only origin/main...HEAD | grep -v '^docs/manual/' || true)
          if [ -n "$other" ]; then
            echo "::error::$REF changes more than docs/manual/:"
            echo "$other"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/manual/package-lock.json
      - run: npm ci
        working-directory: docs/manual
      - run: npm run build
        working-directory: docs/manual
        env:
          # The manual is served at the root of its own domain (atelierx.cftm.net); a repository variable can still override.
          DOCS_BASE: ${{ vars.DOCS_BASE || '/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/manual-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
