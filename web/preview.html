<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Sandboxed JSX preview (architecture: JSX 미리보기 격리). No network beyond the app's own files. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval' 'unsafe-inline' http://localhost:5173 ws://localhost:5173; connect-src ws://localhost:5173 http://localhost:5173; style-src 'self' 'unsafe-inline'; img-src data: blob:; font-src data:"
    />
    <title>Preview</title>
    <style>
      html, body { margin: 0; font-family: 'Pretendard', 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif; font-size: 14px; }
      body { padding: 12px; background: #ffffff; color: #24221e; }
      body.dark { background: #1b1a18; color: #e9e6df; }
      body.inline { padding: 0; background: transparent; }
      .preview-error { white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #c23b33;
        background: #fbeceb; border: 1px solid #f0c4c0; border-radius: 6px; padding: 8px 10px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/preview/main.tsx"></script>
  </body>
</html>
