[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atelierx-backends"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12,<4", "Pillow>=11,<13", "PyJWT[crypto]>=2.10,<3"]

[project.scripts]
atelierx-generation = "atelierx.generation:main"
atelierx-core = "atelierx.core:main"
atelierx-validation = "atelierx.validation:main"
atelierx = "atelierx.cli:main"
atelierx-control = "atelierx.control:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"atelierx.control" = ["ui/*.html", "ui/*.js", "ui/*.css"]
