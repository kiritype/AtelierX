[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atelierx-backends"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12,<4", "Pillow>=11,<13"]

[project.scripts]
atelierx-generation = "atelierx.generation:main"
atelierx-core = "atelierx.core:main"
atelierx-validation = "atelierx.validation:main"
atelierx = "atelierx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
